name: Deploy to GitHub Pages

# The arcade is already a static site — there is nothing to build, bundle or
# transpile. This workflow just publishes the repository as-is.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish, but never queue more than one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify static bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check every module
        run: |
          set -e
          for f in $(find js sw.js -name '*.js'); do
            node --check "$f"
          done
          echo "All modules parsed cleanly."

      - name: Validate the web app manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"

      - name: Reject absolute asset paths
        # Root-anchored paths silently break the site when it is served from a
        # /repository-name/ subdirectory, so fail the build if any appear.
        run: |
          if grep -rnE '(src|href)="/[^/]' index.html css js 2>/dev/null; then
            echo "::error::Absolute path found — all asset paths must be relative (./)."
            exit 1
          fi
          echo "All asset paths are relative."

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
